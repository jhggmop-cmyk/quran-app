<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما بلس | عالم الأفلام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --accent: #e50914;
            --accent-hover: #b20710;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* الشريط العلوي */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(11, 15, 25, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--text-main);
        }

        .search-bar {
            width: 300px;
            max-width: 50%;
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid #334155;
            background: var(--bg-card);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        /* الواجهة الرئيسية Hero */
        .hero {
            position: relative;
            height: 420px;
            background: linear-gradient(to top, var(--bg-main) 10%, rgba(11, 15, 25, 0.4) 100%),
                        url('https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 40px 5%;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero-badge {
            background: var(--accent);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 20px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* أزرار التصنيفات */
        .categories {
            display: flex;
            gap: 10px;
            padding: 25px 5% 10px;
            overflow-x: auto;
        }

        .cat-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid #1e293b;
            padding: 8px 20px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* شبكة الأفلام */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 24px;
            padding: 20px 5% 50px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border: 1px solid #1e293b;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }

        .rating {
            color: var(--gold);
            font-weight: 700;
        }

        /* نافذة التفاصيل (Modal) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            max-width: 650px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-body h2 {
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .modal-body p {
            color: var(--text-muted);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CINEMA<span>PLUS</span></div>
        <input type="text" id="searchInput" class="search-bar" placeholder="ابحث عن فيلم..." onkeyup="filterMovies()">
    </header>

    <section class="hero">
        <div class="hero-content">
            <span class="hero-badge">الأكثر مشاهدة</span>
            <h1>Interstellar (بين النجوم)</h1>
            <p>في مستقبل تواجه فيه الأرض أزمة بيئية تهدد بقاء البشرية، ينطلق فريق من رواد الفضاء عبر ثقب دودي للبحث عن كوكب صالح للحياة.</p>
            <button class="btn-primary" onclick="openMovie(0)">▶ مشاهدة الإعلان والتفاصيل</button>
        </div>
    </section>

    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('خيال علمي', this)">خيال علمي</button>
        <button class="cat-btn" onclick="filterCategory('أكشن', this)">أكشن</button>
        <button class="cat-btn" onclick="filterCategory('أنمي', this)">أنمي</button>
        <button class="cat-btn" onclick="filterCategory('دراما', this)">دراما</button>
    </div>

    <main class="movies-grid" id="moviesGrid"></main>

    <!-- نافذة عرض الفيلم -->
    <div class="modal" id="movieModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="video-wrapper">
                <iframe id="trailerFrame" src="" allowfullscreen></iframe>
            </div>
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>

    <script>
        const movies = [
            {
                title: "Interstellar",
                year: "2014",
                rating: "8.7",
                category: "خيال علمي",
                poster: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=600&q=80",
                trailer: "https://www.youtube.com/embed/zSWdZVtXT7E",
                desc: "ملحمة خيال علمي عن السفر عبر الفضاء والزمن لإنقاذ مستقبل البشرية."
            },
            {
                title: "Spirited Away",
                year: "2001",
                rating: "8.6",
                category: "أنمي",
                poster: "https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=600&q=80",
                trailer: "https://www.youtube.com/embed/ByXuk9QqQkk",
                desc: "فتاة صغيرة تدخل عالماً سحرياً مليئاً بالأرواح وتبحث عن طريقة لإنقاذ والديها."
            },
            {
                title: "The Dark Knight",
                year: "2008",
                rating: "9.0",
                category: "أكشن",
                poster: "https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?auto=format&fit=crop&w=600&q=80",
                trailer: "https://www.youtube.com/embed/EXeTwQWrcwY",
                desc: "يواجه باتمان التحدي الأكبر له في مدينة جوثام ضد العقل المدبر الفوضوي الجوكر."
            },
            {
                title: "Inception",
                year: "2010",
                rating: "8.8",
                category: "خيال علمي",
                poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80",
                trailer: "https://www.youtube.com/embed/YoHD9XEInc0",
                desc: "لص محترف يسرق الأسرار من خلال التسلل إلى اللاوعي أثناء الحلم يُكلف بمهمة زرع فكرة."
            },
            {
                title: "The Pursuit of Happyness",
                year: "2006",
                rating: "8.0",
                category: "دراما",
                poster: "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=600&q=80",
                trailer: "https://www.youtube.com/embed/DMOBlEcRuw8",
                desc: "قصة كفاح حقيقية ملهمة لأب يكافح الفقر والتشرد لبناء مستقبل كريم لابنه."
            },
            {
                title: "Dune: Part Two",
                year: "2024",
                rating: "8.5",
                category: "أكشن",
                poster: "https://images.unsplash.com/photo-1506466010722-395aa2bef877?auto=format&fit=crop&w=600&q=80",
                trailer: "https://www.youtube.com/embed/Way9Dexny3w",
                desc: "يتحد بول أتريديس مع سكان الصحراء في رحلة انتقام واستعادة السيطرة على كوكب أراكيس."
            }
        ];

        let currentCategory = "الكل";

        function renderMovies(list) {
            const grid = document.getElementById("moviesGrid");
            grid.innerHTML = "";
            list.forEach((movie) => {
                const originalIndex = movies.indexOf(movie);
                grid.innerHTML += `
                    <div class="movie-card" onclick="openMovie(${originalIndex})">
                        <img src="${movie.poster}" alt="${movie.title}" class="movie-poster">
                        <div class="movie-info">
                            <div class="movie-title">${movie.title}</div>
                            <div class="movie-meta">
                                <span>${movie.year} • ${movie.category}</span>
                                <span class="rating">★ ${movie.rating}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            filterMovies();
        }

        function filterMovies() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = movies.filter(m => {
                const matchesCat = currentCategory === "الكل" || m.category === currentCategory;
                const matchesSearch = m.title.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderMovies(filtered);
        }

        function openMovie(index) {
            const movie = movies[index];
            document.getElementById("modalTitle").innerText = `${movie.title} (${movie.year})`;
            document.getElementById("modalDesc").innerText = movie.desc;
            document.getElementById("trailerFrame").src = movie.trailer;
            document.getElementById("movieModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("movieModal").style.display = "none";
            document.getElementById("trailerFrame").src = "";
        }

        renderMovies(movies);
    </script>
</body>
    </html>
