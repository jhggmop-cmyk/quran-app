<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الدردشة الجماعية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-sidebar: #111827;
            --bg-card: #1f2937;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* نافذة تسجيل الدخول */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 25, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--bg-sidebar);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: var(--accent);
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            font-family: inherit;
            margin-bottom: 15px;
            outline: none;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-box button:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        /* تخطيط التطبيق الأساسي */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* الشريط الجانبي (الغرف) */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
        }

        .rooms-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .room-item {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(55, 65, 81, 0.4);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .room-item:hover, .room-item.active {
            background: var(--bg-card);
            border-right: 4px solid var(--accent);
        }

        .user-profile {
            padding: 15px 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        /* منطقة المحادثة */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .chat-header {
            padding: 15px 25px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            font-weight: 700;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            word-break: break-word;
        }

        .message.incoming {
            background: var(--bg-card);
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .message.outgoing {
            background: var(--accent);
            color: #000;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
            font-weight: 600;
        }

        .msg-user {
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 4px;
            display: block;
        }

        .message.outgoing .msg-user {
            color: #053b27;
        }

        /* صندوق الكتابة والإرسال */
        .chat-input-area {
            padding: 15px 25px;
            background: var(--bg-sidebar);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--accent);
        }

        .chat-input-area button {
            padding: 0 25px;
            border-radius: 25px;
            border: none;
            background: var(--accent);
            color: #000;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-input-area button:hover {
            background: var(--accent-hover);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- نافذة إدخال الاسم البدئي -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>انضم إلى الدردشة</h2>
            <input type="text" id="usernameInput" placeholder="أدخل اسمك المستعار..." autocomplete="off">
            <button onclick="login()">دخول للمنصة</button>
        </div>
    </div>

    <!-- واجهة المنصة -->
    <div class="app-container" id="appContainer" style="display: none;">
        <!-- الشريط الجانبي والغرف -->
        <div class="sidebar">
            <div class="sidebar-header">غرف النقاش</div>
            <ul class="rooms-list" id="roomsList">
                <li class="room-item active" onclick="switchRoom('عامة', this)">💬 الغرفة العامة</li>
                <li class="room-item" onclick="switchRoom('تقنية وبرمجة', this)">💻 تقنية وبرمجة</li>
                <li class="room-item" onclick="switchRoom('أفلام وأنمي', this)">🎬 أفلام وأنمي</li>
            </ul>
            <div class="user-profile">
                <span id="displayUser">المستخدم</span>
                <span style="color: var(--accent); cursor: pointer;" onclick="logout()">خروج</span>
            </div>
        </div>

        <!-- ساحة المحادثة -->
        <div class="chat-area">
            <div class="chat-header" id="currentRoomTitle">الغرفة العامة</div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." autocomplete="off" onkeypress="checkEnter(event)">
                <button onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";
        let currentRoom = "عامة";
        
        // هيكل لتخزين الرسائل لكل غرفة محلياً
        let chatData = {
            "عامة": [
                { user: "النظام", text: "أهلاً بك في الغرفة العامة!", time: "الآن" }
            ],
            "تقنية وبرمجة": [
                { user: "النظام", text: "مرحباً بك في غرفة البرمجة وتطوير الويب.", time: "الآن" }
            ],
            "أفلام وأنمي": [
                { user: "النظام", text: "شاركنا أفضل الأفلام والأنمي هنا.", time: "الآن" }
            ]
        };

        function login() {
            const name = document.getElementById("usernameInput").value.trim();
            if(!name) {
                alert("الرجاء إدخال الاسم أولاً!");
                return;
            }
            currentUser = name;
            document.getElementById("displayUser").innerText = currentUser;
            document.getElementById("loginOverlay").style.display = "none";
            document.getElementById("appContainer").style.display = "flex";
            renderMessages();
        }

        function logout() {
            currentUser = "";
            document.getElementById("loginOverlay").style.display = "flex";
            document.getElementById("appContainer").style.display = "none";
            document.getElementById("usernameInput").value = "";
        }

        function switchRoom(roomName, element) {
            currentRoom = roomName;
            document.getElementById("currentRoomTitle").innerText = "غرفة: " + roomName;
            
            document.querySelectorAll(".room-item").forEach(item => item.classList.remove("active"));
            element.classList.add("active");
            
            renderMessages();
        }

        function sendMessage() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if(!text) return;

            if(!chatData[currentRoom]) {
                chatData[currentRoom] = [];
            }

            chatData[currentRoom].push({
                user: currentUser,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            input.value = "";
            renderMessages();
        }

        function checkEnter(e) {
            if(e.key === 'Enter') {
                sendMessage();
            }
        }

        function renderMessages() {
            const container = document.getElementById("messagesContainer");
            container.innerHTML = "";
            
            const messages = chatData[currentRoom] || [];
            messages.forEach(msg => {
                const isMe = msg.user === currentUser;
                const div = document.createElement("div");
                div.className = `message ${isMe ? 'outgoing' : 'incoming'}`;
                
                div.innerHTML = `
                    <span class="msg-user">${msg.user}</span>
                    <div>${msg.text}</div>
                `;
                container.appendChild(div);
            });
            
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
                                                     </html>
