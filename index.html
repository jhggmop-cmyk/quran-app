<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الإلكتروني</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #333;
            --card-bg: #fff;
            --primary-color: #00897b;
            --border-color: #e0e0e0;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --primary-color: #26a69a;
            --border-color: #333;
        }

        body {
            font-family: 'Amiri', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* تنسيق بانر الصورة الفخمة */
        .site-banner {
            text-align: center;
            margin: 15px 0 20px 0;
        }

        .site-banner img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 2px solid #d4af37; /* إطار ذهبي أنيق متناسق مع الصورة */
        }

        .header-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        button:hover {
            background-color: var(--primary-color);
            color: #fff;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .surah-list {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .surah-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .surah-item:last-child {
            border-bottom: none;
        }

        .surah-item:hover {
            background-color: rgba(0, 137, 123, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- بانر المصحف الإلكتروني -->
        <div class="site-banner">
            <img src="banner.jpg" alt="القرآن الكريم">
        </div>

        <!-- أزرار التحكم والوضع الليلي -->
        <div class="header-controls">
            <button onclick="toggleDarkMode()">الوضع الليلي</button>
            <button onclick="changeFontSize(-1)">-A</button>
            <button onclick="changeFontSize(1)">+A</button>
        </div>

        <!-- شريط البحث -->
        <input type="text" class="search-box" placeholder="ابحث عن سورة...">

        <!-- قائمة السور -->
        <div class="surah-list">
            <div class="surah-item">
                <span>1. سُورَةُ أَلْفَاتِحَةِ</span>
                <span>مكية (7)</span>
            </div>
            <div class="surah-item">
                <span>2. سُورَةُ البَقَرَةِ</span>
                <span>مدنية (286)</span>
            </div>
            <div class="surah-item">
                <span>3. سُورَةُ آلِ عِمْرَانَ</span>
                <span>مدنية (200)</span>
            </div>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        function changeFontSize(direction) {
            // كود تغيير حجم الخط حسب رغبتك
        }
    </script>
</body>
</html>
